# Google Antigravity's ACP server. Set NWB_AGY_ACP to the agy_acp_server binary and
# NWB_AGY_HOME to a Gemini home directory that holds an Antigravity login.
[models."gemini-3.8-flash"]
label = "Gemini 3.8 Flash"
backend = "acp"
vendor = "google"
command = ["${NWB_AGY_ACP}"]
env = { GEMINI_HOME = "${NWB_AGY_HOME}" }
model = "gemini-3.8-flash-high"
effort = "high"
effort_source = "model-id"
price = { input = 0.75, cached_input = 0.075, output = 3.75, unit = "USD/1M tokens", source = "https://ai.google.dev/gemini-api/docs/pricing", as_of = "2026-10-25" }
can = ["text", "vision"]

[models."gemini-4-argon"]
label = "Gemini 4 Argon"
backend = "acp"
vendor = "google"
command = ["${NWB_AGY_ACP}"]
env = { GEMINI_HOME = "${NWB_AGY_HOME}" }
model = "gemini-4-argon-high"
effort = "high"
effort_source = "model-id"
# List price through 2026-11-30; Google doubles it from 2026-12-01.
price = { input = 2.0, cached_input = 0.1, output = 10.0, unit = "USD/1M tokens", source = "https://ai.google.dev/gemini-api/docs/pricing", as_of = "2026-10-29" }
can = ["text", "vision"]

# Experimental: relies on Antigravity's built-in image tool; see docs/backends.md.
