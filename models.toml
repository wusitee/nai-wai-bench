# --- ACP agents ---

[models."deepseek-v4-pro"]
label = "DeepSeek-V4-Pro"
backend = "acp"
vendor = "deepseek"
command = ["dsh", "--profile", "acp", "--patch", "${NWB_ROOT}/config/dsh-no-tools.patch.yml"]
model = '["deepseek-official","deepseek-v4-pro"]'
effort = "high"
effort_option = "reasoning_effort"
price = { input = 1.32, cached_input = 0.044, output = 3.96, unit = "USD/1M tokens", source = "https://api-docs.deepseek.com/quick_start/pricing/", as_of = "2026-10-25" }
can = ["text"]

# deepseek-flash points to DeepSeek's newest Flash model; update the label when it moves past V4.1.
[models."deepseek-v4.1-flash"]
label = "DeepSeek-V4.1-Flash"
backend = "acp"
vendor = "deepseek"
command = ["dsh", "--profile", "acp", "--patch", "${NWB_ROOT}/config/dsh-no-tools.patch.yml",
           "--patch", "${NWB_ROOT}/config/dsh-flash-default.patch.yml"]
model = '["deepseek-official","deepseek-flash"]'
effort = "high"
effort_option = "reasoning_effort"
price = { input = 0.30, cached_input = 0.006, output = 1.20, unit = "USD/1M tokens", source = "https://api-docs.deepseek.com/quick_start/pricing/", as_of = "2026-10-25" }
can = ["text", "vision"]

[models."kimi-k3"]
timeout = 300
label = "Kimi K3"
backend = "acp"
vendor = "moonshot"
command = ["kimi", "acp"]
model = "kimi-code/k3"
effort = "high"
effort_option = "thinking"
usage_command = "/usage"
config = { mode = "default" }  # tools need approval, which the harness rejects for answers
price = { input = 3.0, cached_input = 0.30, cache_write = 3.0, output = 15.0, unit = "USD/1M tokens", source = "https://platform.kimi.ai/", as_of = "2026-10-25" }
can = ["text", "vision"]

[models."kimi-k3.1-pro"]
timeout = 300
label = "Kimi K3.1 Pro"
backend = "acp"
vendor = "moonshot"
command = ["kimi", "acp"]
model = "kimi-code/k3.1-pro"
effort = "high"
effort_option = "thinking"
usage_command = "/usage"
config = { mode = "default" }
price = { input = 2.0, cached_input = 0.20, cache_write = 2.0, output = 10.0, unit = "USD/1M tokens", source = "https://platform.kimi.ai/", as_of = "2026-10-25" }
can = ["text", "vision"]

