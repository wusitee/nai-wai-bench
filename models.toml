# Models that can be tested or used as judges. Most run through a locally installed, logged-in agent
# CLI; the openai backend calls an OpenAI-compatible API (see docs/backends.md).
# Add or override entries in models.local.toml (git-ignored); tables are merged per model.
#
# can: "text" answers text prompts, "vision" accepts image input, "image" generates images.
# label: display name in the results site.
# vendor: judges from the subject's own vendor are left out of the ensemble when others exist.
# ${VAR} and ~ are expanded in command and env values; ${NWB_ROOT} is the repository root.
# config: extra ACP session config options (id = value), e.g. a mode without tools.
# effort: reasoning effort, "high" wherever the client exposes a control, else "default". ACP agents
# take it through the session option named by effort_option; effort_source = "model-id" marks a model
# id that encodes it.
# price: the vendor's pay-as-you-go list price per 1M tokens, used only for the site's cost estimate;
# subscription CLIs are not billed per token. Update `as_of` whenever a price is re-checked.

[defaults]
judges = ["opus-5.5", "gpt-6.1-sol", "gemini-3.8-flash", "deepseek-v4-pro"]
# Image judging needs vision. Gemini 3.8 Flash rated every image trait "partial" in testing, whatever the
# image showed, so it judges only the understanding track by default. Kimi K3.1 Pro gives every image
# model at least two independent judges; on the v1 images it agreed with Opus and GPT more closely than
# DeepSeek-V4.1-Flash did (rank correlation 0.89 and 0.92).
image_judges = ["opus-5.5", "gpt-6.1-sol", "kimi-k3.1-pro"]

# --- OpenAI via Codex CLI (ChatGPT login) ---

[models."gpt-6.1-sol"]
label = "GPT-6.1-Sol"
backend = "codex"
vendor = "openai"
model = "gpt-6.1-sol"
effort = "high"
tool_profile = "legacy-v1"
price = { input = 2.0, cached_input = 0.10, cache_write = 2.50, output = 10.0, unit = "USD/1M tokens", source = "https://developers.openai.com/api/docs/pricing", as_of = "2026-10-25" }
