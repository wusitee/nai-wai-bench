[state_transfer]
animals = ["cat", "frog"]
extraction_prompt = "Look only at the attached image. Return one JSON object with family, subjects, posture, eyes, mouth, tears, and gesture. Classify family as the unofficial mutated Nailong/Naiwa meme family, official Nailong artwork, or an unrelated character. Count the main characters, not background decorations. For multiple characters, use mixed for eyes, mouth, or gesture only when their visible states differ. Upright means a biped whose visible hips sit above downward-extending thighs; leaning or hunching the torso alone does not make it crouched. Feet and knees may be cropped if both hips and upper thighs visibly establish this arrangement. Crouched requires visibly bent knees and hips lowered toward knee level; prone means lying belly-down. Use out_of_frame for posture if the crop or occlusion hides the hips and thighs, including a torso-only crop even when its upper body is vertical. Narrowed eyes have visibly reduced eyelid openings; closed eyes have no visible pupil aperture. Use phone_hold whenever a phone is held, even if the other hand rests on the belly. Use hands_on_head for two hands at the head, forehead for a hand on the front of the forehead, and hand_at_head for another head touch. Use chin_rest for hands touching/supporting the chin, fighting_pose for the wide bent-knee open-palm-and-fist stance. Use behind_back when the visible arm gesture is behind the torso without a hanging front hand. Use raised_arms for one or both arms lifted or extended away from the torso when no more specific gesture applies. Use covered for eyes or mouth hidden by an object; use out_of_frame for hands outside the image. Use unknown for any field you cannot determine, including when no image is attached. For tears, report present only for visible tear drops or streams, otherwise absent. Do not infer an emotion, motion sequence, or hidden gesture.\nAllowed labels: {\"family\": [\"mutated_nailong\", \"official_nailong\", \"other\"], \"subjects\": [\"one\", \"two\", \"four\", \"five\"], \"posture\": [\"upright\", \"crouched\", \"prone\", \"seated\", \"quadruped\", \"out_of_frame\"], \"eyes\": [\"open\", \"closed\", \"narrowed\", \"covered\", \"mixed\"], \"mouth\": [\"open\", \"closed\", \"covered\", \"mixed\"], \"tears\": [\"present\", \"absent\"], \"gesture\": [\"belly_clutch\", \"behind_back\", \"forehead\", \"chin_rest\", \"forearms_on_ground\", \"phone_hold\", \"folded_arms\", \"holding_hands\", \"mixed\", \"hand_at_head\", \"hands_on_head\", \"thumb_up\", \"pointing\", \"fighting_pose\", \"raised_arms\", \"none\", \"out_of_frame\"]}"
described_prompt = "Generate a single clearly recognizable {en} character in a smooth, bulky 3D cartoon meme style with soft diffuse lighting and a plain light background. Transfer this expression and body language onto the animal: {description} Use the animal's natural colors and markings, rather than copying a yellow or red source body. Adapt any gesture to the animal's anatomy. No captions, lettering, or watermarks."
reference_prompt = "Reimagine the character in the attached reference image as a clearly recognizable {en}. Transfer its visible expression, eye and mouth shape, gesture, posture, and smooth bulky 3D meme style to the animal. Adapt gestures to the animal's anatomy. Preserve the source framing; do not invent gestures outside the frame. Use the animal's natural colors and markings, rather than relying on the source body color to communicate the state. Plain light background. No captions, lettering, or watermarks."

